components:
  securitySchemes:
    accessTokenAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
    idTokenAuth:
        type: apiKey
        in: header
        name: ID
  schemas:
    Cast:
     type: object
     properties:
      name:
        type: string
        example: Name
    Series:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 10
        name:
          type: string
          example: Name
        description:
          type: string
          example: Description
        poster:
          type: string
          example: series/10/poster/1674562131889-castlevania.jpg
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: 2023-01-18T08:51:18.723Z
        updated_at:
          type: string
          format: date-time
          example: 2023-01-18T08:51:18.723Z
        featured:
          type: boolean
          example: false
        director:
          type: string
          example: Director
        casts:
          type: array
          items:
           type: object
           $ref: '#/components/schemas/Cast'
        coming_soon:
          type: boolean
          example: false
        release_date:
          type: string
          format: date-time
          example: 2023-01-18T08:51:18.723Z
        season_count:
          type: integer
          format: int32
          example: 2
        episode_count:
          type: integer
          format: int32
          example: 6
        isInMyList:
          type: boolean
          example: false
        isLiked:
          type: boolean
          example: false
        likes:
          type: integer
          format: int32
          example: 1
        genres:
          type: array
          items:
           type: object
           $ref: '#/components/schemas/Genre'
        languages:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/Language'
        trailers:
          type: array
          items:
           type: object
           $ref: '#/components/schemas/VideoMetaData'
        seasons:
          type: array
          items:
           type: object
           $ref: '#/components/schemas/Season'
    Season:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 
        series_id:
          type: integer
          format: int32
          example: 10
        name:
          type: string
          example: Name
        description:
          type: string
          example: Description
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: 2023-01-18T08:53:08.063Z
        updated_at:
          type: string
          format: date-time
          example: 2023-01-18T08:53:08.063Z
        season_number:
          type: integer
          format: int32
          example: 1
        episodes:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/VideoMetaData'
    VideoMetaData:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        fwp_id:
          type: string
          format: uuid
          example: e2e704f2-902e-4615-a82d-f6a153dfrsdf8
        name:
          type: string
          example: Name
        description:
          type: string
          example: Description
        poster:
          type: string
          example: videos/e2e704f2-902e-4615-a82d-f6a1531f83d8/poster/1676622714101-arcane-lol.jpg
        duration:
          type: integer
          format: int32
          example: 50
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: 2023-02-17T07:49:06.838Z
        updated_at:
          type: string
          format: date-time
          example: 2023-02-17T07:49:06.838Z
        series_id:
          type: integer
          format: int32
          example: null
        season_id:
          type: integer
          format: int32
          example: null
        language_id:
          type: integer
          format: int32
          example: 104
        episode_number:
          type: integer
          format: int32
          example: null
        series:
          type: object
          $ref: '#/components/schemas/Series'
        season:
          type: object
          $ref: '#/components/schemas/Season'
        category:
          type: object
          $ref: '#/components/schemas/Category'
        genres:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/Genre'
        language:
          type: object
          $ref: '#/components/schemas/Language'
    Language:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 37
        code:
          type: string
          example: en
        name:
          type: string
          example: English
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 2
        name:
          type: string
          example: SERIES
    Genre:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          example: Action
    Subscription:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        subscription_plan_id:
          type: integer
          format: int32
          example: 1
        user_id:
          type: string
          format: uuid
          example: aea3406a-3f18-48be-aa54-55c80fcda334
        valid_from:
          type: string
          format: date-time
          example: 2023-02-20T07:04:14.502Z
        valid_till:
          type: string
          format: date-time
          example: 2023-02-20T07:04:14.502Z
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: 2023-02-20T07:04:14.502Z
        updated_at:
          type: string
          format: date-time
          example: 2023-02-20T07:04:14.502Z
        user:
          type: object
          $ref: '#/definitions/User'
        subscriptionPlan:
          type: object
          $ref: '#/definitions/SubscriptionPlan'
    Payment:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        user_id:
          type: string
          format: uuid
          example: aea3406a-3f18-48be-aa54-55c80fcda334
        subscription_plan_id:
          type: integer
          format: int32
          example: 1
        payment_intent_id:
          type: string
          example: pi_1Dt1Zc2eZvKYlo2CWxIDsIH1_secret_TDgoas4E04hTc3c7oaN5eowo8
        paid_amount:
          type: number
          format: double
          example: 99.00
        payment_status:
          type: string
          enum:
            - INITIATED
            - CANCELED
            - COMPLETED
            - FAILED
            - PROCESSING
          example: COMPLETED
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: 2023-02-20T07:04:14.502Z
        updated_at:
          type: string
          format: date-time
          example: 2023-02-20T07:04:14.502Z
        user:
          type: object
          $ref: '#/definitions/User'
        subscriptionPlan:
          type: object
          $ref: '#/definitions/SubscriptionPlan'
    RazorpayPaymentComplete:
      type: object
      properties:
        entity:
          type: "string"
          example: "event"
        event:
          type: "string"
          example: "payment.captured"
        payload:
          type: "object"
          example: 
            payment: 
              entity:
                id: "pay_DESp9bgForNoUd"
                entity: "payment"
                amount: 100
                currency: "INR"
                base_amount: 100
                status: "captured"
                order_id: "order_DESoU0U4ikYA19"
                invoice_id: null
                international: false
                method: "card"
                amount_refunded: 0
                amount_transferred: 0
                refund_status: null
                captured: true
                description: null
                card_id: "card_DESp9fNnu0RoNc"
                card:
                  id: "card_DESp9fNnu0RoNc"
