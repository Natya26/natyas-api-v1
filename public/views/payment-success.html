<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful</title>
    <style>
      body {
        background: #030303;
      }

      .error-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 420px;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        background-color: #201e1e;
        margin: 0 auto;
        margin-top: 100px;
        text-align: center;
      }
      @media (min-width: 320px) and (max-width: 400px) {
     .error-card {
        width: 250px;
     }
     .error-title {
        font-size: 16px !important;
     }
     .error-message {
        font-size: 14px !important;
     }
     h3.input-with-border {
        font-size: 12px !important;
     }
     .text-color {
        font-size: 13px !important;
     }
      }
      @media (min-width: 400px) and (max-width: 600px) {
     .error-card {
        width: 300px;
     }
     .error-title {
        font-size: 17px !important;
     }
     .error-message {
        font-size: 15px !important;
     }
     h3.input-with-border {
        font-size: 13px !important;
     }
     .text-color {
        font-size: 14px !important;
     }
      }

      .error-title {
        color: rgb(37 131 50);
        font-family: sans-serif;
        font-size: 24px;
        margin-bottom: 20px;
      }

      .error-message {
        color: #d8d7d7;
        font-family: sans-serif;
        font-size: 18px;
        margin-bottom: 20px;
      }

      .error-link {
        color: #f4793b;
        text-decoration: none;
        font-family: sans-serif;
        font-size: 18px;
        transition: color 0.3s ease;
      }

      .error-link:hover {
        color: #f1a680;
      }
      .app-email {
        margin-top: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }
      h3.input-with-border {
        line-height: 1.5;
        font-family: sans-serif;
        line-break: anywhere;
        font-size: 15px;
        color: #918d8d;
      }
      .text-color {
        color: #d8d7d7;
        font-family: sans-serif;
        line-break: anywhere;
        font-size: 16px;
        font-weight: 400;
      }
      .under-line {
        width: 100%;
        height: 1px;
        background: #343333;
      }
    </style>
  </head>
  <body>
    <div class="error-card">
      <h1 class="error-title">Payment Successful</h1>
      <p class="error-message">
        Your payment has been successfully processed.<br>
        For any related enquiries, contact customer support<br>
        and provide the following transaction ID.
      </p>
      <div class="app-email">
        <label for="transaction-id" class="text-color">Transaction ID</label>
        <h3 class="input-with-border" id="transaction-id" spellcheck="false">
          <%= txnId %>
        </h3>
      </div>
      <div class="under-line"></div>
    </div>
  </body>
</html>
